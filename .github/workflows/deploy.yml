name: Deploy apps to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'PrimeroColegio/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout Cuentos Magicos
        uses: actions/checkout@v4
        with:
          ref: claude/spanish-kids-reading-app-ttd1O
          path: cuentos-repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: main-repo/PrimeroColegio/package-lock.json

      - name: Install dependencies
        working-directory: main-repo/PrimeroColegio
        run: npm ci

      - name: Build PrimeroColegio
        working-directory: main-repo/PrimeroColegio
        run: npm run build

      - name: Prepare deploy folder
        run: |
          mkdir -p deploy/primero
          cp -r main-repo/PrimeroColegio/dist/. deploy/primero/
          cp cuentos-repo/index.html cuentos-repo/app.js cuentos-repo/style.css deploy/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
